# QR-5: the backend's contract. Here it stands in for the one the backend will publish; in production it is
# pulled from the backend, not authored in the frontend. `bun run generate` turns it into src/api/generated.
openapi: 3.1.0
info:
  title: Tallyfolio transactions
  version: 0.1.0
paths:
  /transactions:
    get:
      operationId: listTransactions
      summary: A page of the user's transactions, newest first
      description: The page model is a placeholder; D-06 decides pagination, sorting and filtering.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque; the previous page's `nextCursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TransactionKind" }
        - name: sort
          in: query
          required: false
          description: >-
            The order the whole set is read in, not the page. An enum rather than free text, so the
            router, the schema and the server cannot disagree about what is sortable (D-06).
          schema: { $ref: "#/components/schemas/TransactionSort" }
      responses:
        "200":
          description: A page of transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        default:
          description: A problem (RFC 9457)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    CryptoAmount:
      description: An amount in the asset's smallest unit, as an integer string; decimals travel with it (D-08).
      type: object
      required: [asset, decimals, baseUnits]
      properties:
        asset: { type: string, minLength: 1, description: "The asset's id, never a ticker" }
        decimals: { type: integer, minimum: 0, maximum: 36 }
        baseUnits: { type: string, pattern: "^-?[0-9]+$" }
    FiatAmount:
      description: >-
        An amount as an integer string in the minor unit the server counts in, with that unit's exponent:
        minor 123456 with exponent 2 is 1234.56. Currency tables disagree on the exponent, so it travels
        with the amount (D-08, CC-06).
      type: object
      required: [currency, exponent, minor]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217 }
        exponent:
          type: integer
          minimum: 0
          maximum: 4
        minor: { type: string, pattern: "^-?[0-9]+$" }
    TransactionKind:
      type: string
      enum: [deposit, withdrawal, trade]
    TransactionSort:
      description: >-
        A field and a direction. `occurredAt:desc` is the default, which is what "newest first" means.
        Sorting by value orders by the fiat value the server recorded, never by a crypto amount: two
        amounts in different assets are not comparable (QR-1, D-08).
      type: string
      enum: [occurredAt:desc, occurredAt:asc, value:desc, value:asc]
      default: occurredAt:desc
    Deposit:
      type: object
      required: [kind, id, occurredAt, amount, value]
      properties:
        kind: { type: string, const: deposit }
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        amount: { $ref: "#/components/schemas/CryptoAmount" }
        value: { $ref: "#/components/schemas/FiatAmount" }
    Withdrawal:
      type: object
      required: [kind, id, occurredAt, amount, value]
      properties:
        kind: { type: string, const: withdrawal }
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        amount: { $ref: "#/components/schemas/CryptoAmount" }
        value: { $ref: "#/components/schemas/FiatAmount" }
    Trade:
      type: object
      required: [kind, id, occurredAt, sold, bought, value]
      properties:
        kind: { type: string, const: trade }
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        sold: { $ref: "#/components/schemas/CryptoAmount" }
        bought: { $ref: "#/components/schemas/CryptoAmount" }
        value: { $ref: "#/components/schemas/FiatAmount" }
    Transaction:
      oneOf:
        - { $ref: "#/components/schemas/Deposit" }
        - { $ref: "#/components/schemas/Withdrawal" }
        - { $ref: "#/components/schemas/Trade" }
      discriminator: { propertyName: kind }
    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor: { type: string }
