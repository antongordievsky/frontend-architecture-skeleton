# C-2: `docker compose up` is the only command needed. Everything runs in Docker (D-12).
#   docker compose up                      → development, hot reload        http://localhost:5173
#   docker compose --profile prod up       → the production form, via Caddy http://localhost:8080
#   docker compose run --rm check          → the full check, no host runtime needed
services:
  web:
    build: { context: ., target: dev }
    ports: ["${WEB_PORT:-5173}:5173"]
    volumes:
      - .:/app
      # Keeps the image's Linux node_modules: mixing it with a host install breaks native binaries.
      # The volume outlives rebuilds, so the dev and check commands re-sync it with bun.lock on start.
      - node_modules:/app/node_modules

  web-prod:
    profiles: [prod]
    build: { context: ., target: prod }
    ports: ["${PROD_PORT:-8080}:8080"]

  check:
    profiles: [tools]
    build: { context: ., target: deps }
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "bun install --frozen-lockfile --ignore-scripts && exec bun run check"]

  # D-14: the parts' stories as component tests and screenshots, in three engines. Arguments go to Playwright:
  #   docker compose run --rm browser                        compare against the baselines
  #   docker compose run --rm browser --update-snapshots     rewrite them, on purpose, for review in the commit
  browser:
    profiles: [tools]
    build: { context: ., target: browser }
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Chromium needs more shared memory than Docker's default; a larger /dev/shm gives it that without
    # sharing the host's IPC namespace. init reaps the browsers' child processes.
    shm_size: 1gb
    init: true
    entrypoint:
      - sh
      - -c
      - bun install --frozen-lockfile --ignore-scripts && exec node_modules/.bin/playwright test "$@"
      - --

volumes:
  node_modules:
