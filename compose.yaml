# C-2: `docker compose up` is the only command needed. Everything runs in Docker (D-12).
#   docker compose up                      → development, hot reload        http://localhost:5173
#   docker compose --profile prod up       → the production form, via Caddy http://localhost:8080
#   docker compose run --rm check          → the full check, no host runtime needed
services:
  # C-2: on the `up` path, dependencies are installed once, before anything that needs them starts. Two
  # services installing into the shared node_modules volume at the same time is a race — plan 08 saw it fail
  # with "ENOENT: copying file" — and a reviewer's first `docker compose up` must not depend on timing.
  # The `run` services (check, browser) install for themselves instead: `run` does not wait for a completed
  # dependency, and being started one at a time they cannot race.
  deps:
    build: { context: ., target: deps }
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["bun", "install", "--frozen-lockfile", "--ignore-scripts"]

  web:
    build: { context: ., target: dev }
    ports: ["${WEB_PORT:-5173}:5173"]
    depends_on:
      deps: { condition: service_completed_successfully }
      mock: { condition: service_started }
    environment:
      MOCK_URL: http://mock:3001
    volumes:
      - .:/app
      # Keeps the image's Linux node_modules: mixing it with a host install breaks native binaries.
      # The volume outlives rebuilds, so the dev and check commands re-sync it with bun.lock on start.
      - node_modules:/app/node_modules

  web-prod:
    profiles: [prod]
    build: { context: ., target: prod }
    ports: ["${PROD_PORT:-8080}:8080"]
    depends_on:
      mock: { condition: service_started }
    environment:
      MOCK_URL: mock:3001

  # D-04, D-12: the stand-in backend as a real HTTP server, on the image that already exists — a different
  # command, not a new build stage. Its shape comes from the environment, so a loading state or a failure can
  # be seen without touching code (mock/server.ts names every variable).
  mock:
    build: { context: ., target: deps }
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      MOCK_SEED: "${MOCK_SEED:-42}"
      MOCK_COUNT: "${MOCK_COUNT:-10000}"
      MOCK_LATENCY_MS: "${MOCK_LATENCY_MS:-0}"
      MOCK_FAIL_STATUS: "${MOCK_FAIL_STATUS:-}"
    depends_on:
      deps: { condition: service_completed_successfully }
    command: ["bun", "run", "mock/server.ts"]

  check:
    profiles: [tools]
    build: { context: ., target: deps }
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "bun install --frozen-lockfile --ignore-scripts && exec bun run check"]

  # D-14: the parts' stories as component tests and screenshots, in three engines. Arguments go to Playwright:
  #   docker compose run --rm browser                        compare against the baselines
  #   docker compose run --rm browser --update-snapshots     rewrite them, on purpose, for review in the commit
  browser:
    profiles: [tools]
    build: { context: ., target: browser }
    # The suite starts its own dev server inside this container, and that server proxies /api. Without
    # MOCK_URL it would dial localhost:3001, where nothing listens in here (measured: ECONNREFUSED, and a
    # page-level test saw an app with no data). The stand-in is a container away, by name.
    depends_on:
      mock: { condition: service_started }
    environment:
      MOCK_URL: http://mock:3001
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Chromium needs more shared memory than Docker's default; a larger /dev/shm gives it that without
    # sharing the host's IPC namespace. init reaps the browsers' child processes.
    shm_size: 1gb
    init: true
    entrypoint:
      - sh
      - -c
      - bun install --frozen-lockfile --ignore-scripts && exec node_modules/.bin/playwright test "$@"
      - --

volumes:
  node_modules:
